<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ayo Berhitung!</title>
<meta name="theme-color" content="#ff8fc7">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Berhitung">
<style>
  :root {
    --pink: #ff8fc7; --pink-d: #e85aa5; --lilac: #c9a7ff; --lilac-d: #9b6cf0;
    --cream: #fff6fb; --ink: #6b2c5a; --mint: #7fe0b8; --mint-d: #3fb98a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Comic Sans MS", system-ui, sans-serif;
    color: var(--ink);
    background: radial-gradient(circle at 20% 10%, #ffe3f3 0, transparent 40%),
                radial-gradient(circle at 85% 90%, #eadcff 0, transparent 45%),
                linear-gradient(160deg, #fff0f8, #f3e9ff);
    background-attachment: fixed;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  .screen { min-height: 100%; padding: max(16px, env(safe-area-inset-top)) 16px 24px; max-width: 900px; margin: 0 auto; }
  [hidden] { display: none !important; }

  /* --- home --- */
  h1 { text-align: center; font-size: clamp(36px, 8vw, 64px); margin: 12px 0 4px; color: var(--pink-d);
       text-shadow: 3px 3px 0 #fff, 5px 5px 0 var(--lilac); }
  .sub { text-align: center; font-size: clamp(18px, 3.5vw, 24px); margin: 0 0 20px; }
  .mascot { display: block; text-align: center; font-size: clamp(56px, 12vw, 96px); animation: bob 2.4s ease-in-out infinite; }
  #levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
  .level { background: #fff; border-radius: 26px; padding: 16px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px;
           box-shadow: 0 6px 0 var(--lilac), 0 10px 20px #c9a7ff55; transition: transform .1s; }
  .level:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--lilac); }
  .level.locked { opacity: .55; filter: grayscale(.6); }
  .lv-icon { font-size: 44px; }
  .lv-num { font-weight: 800; color: var(--pink-d); font-size: 18px; }
  .lv-name { font-size: 15px; text-align: center; }
  .lv-stars { font-size: 20px; color: #f5b400; letter-spacing: 2px; }
  #btn-reset { display: block; margin: 28px auto 0; background: none; opacity: .5; font-size: 14px; text-decoration: underline; }

  /* --- game --- */
  .topbar { display: flex; align-items: center; gap: 10px; }
  .round { width: 56px; height: 56px; border-radius: 50%; background: #fff; font-size: 28px; flex: none;
           box-shadow: 0 4px 0 var(--lilac); }
  #progress { flex: 1; display: flex; gap: 6px; justify-content: center; }
  #progress span { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 3px solid var(--lilac); }
  #progress .done { background: var(--pink); border-color: var(--pink-d); }
  #progress .now { border-color: var(--pink-d); transform: scale(1.25); }
  .helper { display: flex; align-items: flex-end; gap: 8px; margin: 18px 0 8px; }
  .helper .mascot { font-size: 64px; display: inline-block; }
  #bubble { background: #fff; border-radius: 22px 22px 22px 4px; padding: 12px 18px; font-size: clamp(18px, 3.5vw, 24px); font-weight: 700;
            box-shadow: 0 4px 12px #e85aa522; margin-bottom: 30px; }
  #question { background: #fff; border-radius: 32px; padding: 24px 16px; text-align: center; min-height: 180px;
              box-shadow: 0 8px 0 var(--pink), 0 14px 30px #ff8fc744; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
  .ask { font-size: clamp(28px, 6vw, 44px); font-weight: 800; }
  .sum { font-size: clamp(52px, 13vw, 96px); font-weight: 900; color: var(--pink-d); letter-spacing: 2px; }
  .qm { display: inline-block; min-width: 1.2em; color: var(--lilac-d); }
  .picrow { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; font-size: 32px; }
  .pics { display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 4px; font-size: clamp(28px, 6vw, 40px); max-width: 100%; }
  .pics.big { font-size: clamp(40px, 9vw, 64px); gap: 10px; max-width: 520px; margin: 0 auto; }
  .pics .gone { opacity: .3; position: relative; }
  .pics .gone::after { content: "✖"; position: absolute; inset: 0; color: #e8457a; display: grid; place-items: center; opacity: 1; }
  #choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 26px; }
  .choice { background: var(--lilac); color: #fff; font-size: clamp(40px, 10vw, 64px); font-weight: 900; padding: 18px 0;
            border-radius: 28px; box-shadow: 0 7px 0 var(--lilac-d); text-shadow: 2px 2px 0 #0002; transition: transform .1s; }
  .choice:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--lilac-d); }
  .choice.right { background: var(--mint); box-shadow: 0 7px 0 var(--mint-d); animation: pop .4s; }
  .choice.wrong { background: #f3c7d9; box-shadow: 0 7px 0 #e3a3bd; animation: shake .4s; }

  /* --- result --- */
  #result { text-align: center; padding-top: 10vh; }
  #result-stars { font-size: clamp(64px, 16vw, 110px); animation: pop .6s; }
  #result-text { font-size: clamp(26px, 6vw, 40px); font-weight: 800; color: var(--pink-d); margin: 10px 0 30px; }
  .big-btn { display: block; width: min(360px, 100%); margin: 14px auto; padding: 18px; border-radius: 28px; font-size: 26px; font-weight: 800;
             background: var(--pink); color: #fff; box-shadow: 0 7px 0 var(--pink-d); }
  .big-btn.alt { background: #fff; color: var(--ink); box-shadow: 0 7px 0 var(--lilac); }

  .confetti { position: fixed; top: -50px; font-size: 32px; pointer-events: none; animation: fall 1.6s ease-in forwards; z-index: 9; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
  @keyframes bob { 50% { transform: translateY(-10px) rotate(-4deg); } }
  @keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.15); } }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
  <section id="home" class="screen">
    <span class="mascot">🦄</span>
    <h1>Ayo Berhitung!</h1>
    <p class="sub">Pilih level dan kumpulkan bintang ⭐</p>
    <div id="levels"></div>
    <button id="btn-reset">Ulang dari awal (orang tua)</button>
  </section>

  <section id="game" class="screen" hidden>
    <div class="topbar">
      <button id="btn-back" class="round" aria-label="Kembali">🏠</button>
      <div id="progress"></div>
      <button id="btn-speak" class="round" aria-label="Dengar soal">🔊</button>
    </div>
    <div class="helper"><span class="mascot">🦄</span><div id="bubble"></div></div>
    <div id="question"></div>
    <div id="choices"></div>
  </section>

  <section id="result" class="screen" hidden>
    <div id="result-stars"></div>
    <div id="result-text"></div>
    <button id="btn-next" class="big-btn">Level Berikutnya ➜</button>
    <button id="btn-again" class="big-btn alt">Main Lagi 🔁</button>
    <button id="btn-home" class="big-btn alt">Pilih Level 🏠</button>
  </section>

  <script src="game.js"></script>
</body>
</html>
